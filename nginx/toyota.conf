# Konfigurasi Nginx untuk Toyota Attendance Web App
# Akses: http://<IP_VPS>:2983

server {
    listen 2983;
    listen [::]:2983;

    server_name _;

    # Maksimum ukuran upload (misal file export/dokumen)
    client_max_body_size 50M;

    # Gzip Compression untuk performa cepat
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Reverse proxy ke aplikasi Next.js (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (HMR & dynamic features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # PENTING: Gunakan $http_host agar port :2983 tetap terbawa saat redirect
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 2983;

        proxy_cache_bypass $http_upgrade;
    }

    # Cache untuk static assets Next.js (_next/static)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;

        expires 365d;
        access_log off;
    }

    # Cache untuk file publik statis
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;

        expires 30d;
        access_log off;
    }
}
